version: '3.9'

services:
  server:
    container_name: budgettracker-api
    restart: always
    build:
      context: .
      dockerfile: BudgetTracker.Server/Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - db
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__Default=Server=db;Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD}
      
  client:
    container_name: budgettracker-client-builder
    restart: "no"
    image: node:18
    working_dir: /app
    volumes:
      - ./budgettracker.client:/app
      - ./nginx/html:/app/dist
    command: >
      sh -c "npm install &&
             npm run build -- --output-path=dist &&
             cp -r dist/budgettracker.client/* dist/"
    depends_on:
      - server

  nginx:
    container_name: budgettracker-nginx
    restart: always
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client

  db:
    container_name: budgettracker-db
    restart: always
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - SA_PASSWORD=${DB_PASSWORD}
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
