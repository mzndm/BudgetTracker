version: "3.9"

services:
  frontend:
    container_name: budgettracker-nginx
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    expose:
      - 80
    depends_on:
      - backend

  backend:
    container_name: budgettracker-api
    restart: always
    build:
      context: .
      dockerfile: BudgetTracker.Server/Dockerfile
    expose:
      - 80
    depends_on:
      - db
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__Default=Server=db;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};Encrypt=True;TrustServerCertificate=True;

  db:
    container_name: budgettracker-db
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - SA_PASSWORD=${DB_PASSWORD}
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - /home/ubuntu/mssql/backup:/var/opt/mssql/backup
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: budgettracker-tunnel
    restart: unless-stopped
    command: tunnel --config /root/.cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared

volumes:
  mssql-data:
