<div class="list__item">
  <mat-icon class="material-symbols-outlined list__icon">
    {{categoryIcon || "shopping_bag" }}
  </mat-icon>

  <div class="list__main">
    <h4 class="list__title">{{displayTitle}}</h4>
    <p class="list__text">{{displayNote}}</p>
  </div>

  <div class="details">
    <p class="amount"
       [class.amount__income]="isIncome"
       [class.amount__transfer]="isTransfer">
      {{ (transaction.amount / 100) | abs }} UAH 
    </p>
    <p class="account">
      {{displayAccount}}
      @if (isTransfer) {
        => {{displayAccountTo}}
      }
    </p>
  </div>

  </button>
   -->
</div>
